<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeInfo</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="img/Pokeball_red.png">
    <script type="text/javascript" src="script.js" defer></script>
</head>
<body>
    <header>
    <nav class="navbar">
        <!--
        <img class="logo" src="img/pokeball_blue.png">
        -->
        
        <div class="nav-title">PokeInfo</div>
            <input id="search" placeholder="Pokemon">
            <button class="send" onclick="pokeSearch()">Send</button>
            </div>
            <ul id="menu" class="nav-link">
                <li><a href="#">Text</a></li>
                <li><a href="#">Text</a></li>
                <li><a href="#">Text</a></li>
                <li><a href="#">Text</a></li>
                <li class="credits"><a>Made By - Emi-Cello</a></li>
            </ul>
        <button id="nav-menu" onclick="toggleMenu()" aria-label="Toggle navigation">
            -
        </button>
    </nav>
    </header>
    <h1 id="pokemon-name">Loading...</h1>
    <h1 id="pokemon-type">Loading...</h1>
    <h1 id="pokemon-type-secondary">Loading...</h1>
    <p id="dex">PokeDex Nr:</p>
    <p id="pokemon-Dex">Loading...</p>
    <div class="pokemon-sprites">
        <img id="pokemon-front" width="160">
        <img id="pokemon-back" width="160">
        <button id="shiny" onclick="toggleShiny()">Shiny</button>
    </div>
    <div id="stats">
        <span>Health</span>
            <p id="stats-hp">...Hp</p>
        <div class="bar">
            <div id="hp-bar" class="fill-hp"></div>
        </div>
        <span>Attack</span>
            <p id="stats-atk">...atk</p>
        <div class="bar">
            <div id="atk-bar" class="fill-atk"></div>
        </div>
        <span>Defence</span>
            <p id="stats-def">...def</p>
        <div class="bar">
            <div id="def-bar" class="fill-def"></div>
        </div>
        <span>Special Attack</span>
            <p id="stats-spa">...spa</p>
        <div class="bar">
            <div id="spa-bar" class="fill-spa"></div>
        </div>
        <span>Special Defence</span>
            <p id="stats-spd">...spd</p>
        <div class="bar">
            <div id="spd-bar" class="fill-spd"></div>
        </div>
        <span>Speed</span>
            <p id="stats-spe">...spe</p>
        <div class="bar">
            <div id="spe-bar" class="fill-spe"></div>
        </div>
    </div>
    <footer>V 0.4</footer>
</body>
</html>
